<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} | {{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" href="{{ '/assets/img/favicon.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header class="site"><div class="wrap">
  <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav aria-label="Main"><ul><li><a href="{{ '/#blog' | relative_url }}">← All posts</a></li><li><a href="{{ '/' | relative_url }}">Home</a></li></ul></nav>
</div></header>
<main id="main" class="wrap">
  <article class="post">
    <h1>{{ page.title }}</h1>
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
    {{ content }}
  </article>
</main>
<footer><div class="wrap">© {{ site.time | date: "%Y" }} {{ site.title }}</div></footer>
</body>
</html>
